<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gobo Pro">
    <title>Gobo Pro - Ultimate Engineering</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --accent: #e67e22; --success: #27ae60; --warning: #f1c40f; --bg: #f4f6f8; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 20px; padding-top: env(safe-area-inset-top); }
        
        /* تم زيادة العرض الأقصى ليناسب وضع الشاشتين بجانب بعض */
        .app-container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 25px; }
        
        /* التحديث الجديد: ترتيب الأقسام بنظام الشبكة (Grid) */
        .panels-wrapper { display: grid; grid-template-columns: 1fr; gap: 25px; align-items: start; }
        @media (min-width: 850px) {
            .panels-wrapper { grid-template-columns: 1fr 1fr; }
        }

        .card { background: #fafafa; border: 1px solid #eee; padding: 20px; border-radius: 15px; }
        .card-title { font-size: 15px; font-weight: bold; color: #7f8c8d; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: bold; }
        input[type="number"], input[type="file"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 15px; font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; background: var(--secondary); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        .btn-main:hover { background: #2980b9; }
        
        .auto-calc-area { background: #fff; border: 2px solid var(--secondary); padding: 15px; border-radius: 12px; margin-top: 10px; }
        .warning-box { background: #fcf3cf; color: #9a7d0a; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 10px; display: none; text-align: center; font-weight:bold; }
        
        .slider-container { margin-top: 15px; margin-bottom: 15px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        .canvas-container { text-align: center; margin-top: 20px; background: #fff; padding: 10px; border-radius: 10px; display: none; border: 1px solid #eee;}
        canvas { max-width: 100%; height: auto; border-radius: 10px; }
        #downloadBtn { display: none; background: var(--success); margin-top: 20px; }
        #downloadBtn:hover { background: #219653; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🎯 Gobo Pro (JWB Edition)</h1>

    <div class="panels-wrapper">
        
        <div class="card">
            <div class="card-title">1. القياسات الميدانية (التصغير وتشوه المنظور)</div>
            
            <label>عدسة جهازك (Lens Scale):</label>
            <select id="lensRatio">
                <option value="0.2">0.2 Scale (للمسافات البعيدة)</option>
                <option value="0.3" selected>0.3 Scale (العدسة الافتراضية - Default)</option>
                <option value="0.45">0.45 Scale (للمسافات المتوسطة)</option>
                <option value="0.65">0.65 Scale (للمسافات القريبة)</option>
            </select>

            <div class="grid-2">
                <div>
                    <label>المسافة للجدار (D):</label>
                    <input type="number" id="dist" placeholder="بالمتر">
                </div>
                <div>
                    <label>ارتفاع البروجكتور (H_pj):</label>
                    <input type="number" id="hProj" placeholder="بالمتر">
                </div>
            </div>

            <div class="grid-2">
                <div>
                    <label>أعلى نقطة للتصميم (H_top):</label>
                    <input type="number" id="hTop" placeholder="بالمتر">
                </div>
                <div>
                    <label>أدنى نقطة للتصميم (H_bot):</label>
                    <input type="number" id="hBottom" placeholder="بالمتر">
                </div>
            </div>
            
            <div class="auto-calc-area">
                <label>العرض المستهدف للتصميم (بالمتر):</label>
                <input type="number" id="targetW" placeholder="عرض الشعار المطلوب على الجدار">
            </div>

            <div id="resultsBox" style="display:none; margin-top:20px; text-align:center; padding-top: 15px; border-top: 1px dashed #ccc;">
                <div style="font-size:14px; color:#666;">القطر الأقصى لضوء العدسة: <b id="maxDia">--</b> م</div>
                <div style="font-size:18px; color:var(--accent); margin-top:8px;">تم ضبط التصغير التلقائي (Scale) إلى: <b id="suggestedScale">--</b></div>
                <div style="font-size:14px; color:#c0392b; margin-top:8px;">معامل عصر المنظور (Keystone): <b id="ratioVal">--</b></div>
                <div id="warning" class="warning-box">⚠️ تنبيه: هدفك أكبر من قدرة العدسة! ستحتاج لإرجاع البروجكتور للخلف أو تغيير العدسة.</div>
            </div>
        </div>

        <div class="card" id="processorCard" style="display:none;">
            <div class="card-title">2. تجهيز ملف التصنيع (Gobo 37mm)</div>
            <input type="file" id="imageUpload" accept="image/*">
            
            <div class="slider-container">
                <label style="display:flex; justify-content:space-between;">
                    <span>تعديل يدوي للحجم (Scale):</span> 
                    <span id="scaleValDisplay" style="color:var(--accent); font-weight:bold;">100%</span>
                </label>
                <input type="range" id="scaleSlider" min="5" max="100" value="100">
            </div>

            <div class="slider-container">
                <label style="display:flex; justify-content:space-between;">
                    <span>درجة التباين (Threshold):</span> 
                    <span id="thresholdValDisplay" style="color:var(--accent); font-weight:bold;">128</span>
                </label>
                <input type="range" id="thresholdSlider" min="0" max="255" value="128">
            </div>

            <div style="display:flex; gap:15px; margin-top:20px;">
                <label style="font-size:14px; cursor:pointer;"><input type="checkbox" id="invert"> عكس الألوان (لإضاءة الشعار)</label>
                <label style="font-size:14px; cursor:pointer;"><input type="checkbox" id="mask" checked> قناع العدسة (37mm)</label>
            </div>
            
            <div class="canvas-container" id="previewArea">
                <canvas id="canvas"></canvas>
                <button id="downloadBtn" class="btn-main" onclick="downloadGobo()">⬇️ حفظ الملف للإرسال لـ AliExpress</button>
            </div>
        </div>

    </div>
</div>

<script>
    let originalImg = null;
    let globalRatio = 1;

    const inputsToWatch = ['dist', 'hProj', 'hTop', 'hBottom', 'targetW'];
    inputsToWatch.forEach(id => {
        document.getElementById(id).addEventListener('input', calculateSystem);
    });
    document.getElementById('lensRatio').addEventListener('change', calculateSystem);

    function calculateSystem() {
        const d = parseFloat(document.getElementById('dist').value);
        const hProj = parseFloat(document.getElementById('hProj').value);
        const hTop = parseFloat(document.getElementById('hTop').value);
        const hBottom = parseFloat(document.getElementById('hBottom').value);
        const tW = parseFloat(document.getElementById('targetW').value);
        const lensRatio = parseFloat(document.getElementById('lensRatio').value);

        if (!d || !hProj || !hTop || !hBottom || !tW) {
            document.getElementById('resultsBox').style.display = 'none';
            return; 
        }

        const h_top_rel = hTop - hProj;
        const h_bottom_rel = hBottom - hProj;
        const S_top = Math.sqrt(Math.pow(d, 2) + Math.pow(h_top_rel, 2));
        const S_bottom = Math.sqrt(Math.pow(d, 2) + Math.pow(h_bottom_rel, 2));
        globalRatio = S_bottom / S_top;
        document.getElementById('ratioVal').innerText = (globalRatio * 100).toFixed(1) + "%";

        const maxDiameter = d * lensRatio;
        document.getElementById('maxDia').innerText = maxDiameter.toFixed(2);

        const targetH = hTop - hBottom;
        const targetMax = Math.max(tW, targetH);
        let scale = (targetMax / maxDiameter) * 100;

        if (scale > 100) {
            document.getElementById('warning').style.display = 'block';
            scale = 100;
        } else {
            document.getElementById('warning').style.display = 'none';
        }

        document.getElementById('suggestedScale').innerText = scale.toFixed(1) + "%";
        document.getElementById('resultsBox').style.display = 'block';
        document.getElementById('processorCard').style.display = 'block';
        
        document.getElementById('scaleSlider').value = scale;
        document.getElementById('scaleValDisplay').innerText = scale.toFixed(1) + "%";
        
        if(originalImg) processGobo();
    }

    document.getElementById('imageUpload').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            originalImg = new Image();
            originalImg.onload = () => processGobo();
            originalImg.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('scaleSlider').oninput = (e) => {
        document.getElementById('scaleValDisplay').innerText = e.target.value + "%";
        if(originalImg) processGobo();
    };
    
    document.getElementById('thresholdSlider').oninput = (e) => {
        document.getElementById('thresholdValDisplay').innerText = e.target.value;
        if(originalImg) processGobo();
    };
    
    document.getElementById('invert').onchange = () => { if(originalImg) processGobo(); };
    document.getElementById('mask').onchange = () => { if(originalImg) processGobo(); };

    function processGobo() {
        if (!originalImg) return;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const size = Math.max(originalImg.width, originalImg.height);
        canvas.width = size; canvas.height = size;

        const scale = document.getElementById('scaleSlider').value / 100;
        const inv = document.getElementById('invert').checked;
        const threshold = parseInt(document.getElementById('thresholdSlider').value);

        ctx.fillStyle = "rgba(0,0,0,0)";
        ctx.fillRect(0,0,size,size);

        const w = originalImg.width * scale;
        const h = originalImg.height * scale;
        const offsetX = (size-w)/2;
        const offsetY = (size-h)/2;
        ctx.drawImage(originalImg, offsetX, offsetY, w, h);

        const imgData = ctx.getImageData(0,0,size,size);
        for (let i=0; i<imgData.data.length; i+=4) {
            if (imgData.data[i+3] === 0) continue; 
            let avg = (imgData.data[i] * 0.299 + imgData.data[i+1] * 0.587 + imgData.data[i+2] * 0.114);
            let val = avg > threshold ? 255 : 0;
            if (inv) val = 255 - val;
            imgData.data[i] = imgData.data[i+1] = imgData.data[i+2] = val;
            imgData.data[i+3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);

        const squeezedCanvas = document.createElement('canvas');
        squeezedCanvas.width = size; squeezedCanvas.height = size;
        const squeezedCtx = squeezedCanvas.getContext('2d');
        
        squeezedCtx.fillStyle = inv ? "#000" : "#fff";
        squeezedCtx.fillRect(0, 0, size, size);

        for (let y = 0; y < size; y++) {
            let t = y / size;
            let currentWidth = (size * globalRatio) * (1 - t) + (size * t);
            let offX = (size - currentWidth) / 2;
            squeezedCtx.drawImage(canvas, 0, y, size, 1, offX, y, currentWidth, 1);
        }

        if (document.getElementById('mask').checked) {
            squeezedCtx.globalCompositeOperation = 'destination-in';
            squeezedCtx.beginPath(); squeezedCtx.arc(size/2, size/2, size/2, 0, Math.PI*2); squeezedCtx.fill();
            squeezedCtx.globalCompositeOperation = 'destination-over';
            squeezedCtx.fillStyle = "#000"; squeezedCtx.fillRect(0,0,size,size);
            squeezedCtx.globalCompositeOperation = 'source-over';
        }

        canvas.width = size; canvas.height = size;
        ctx.drawImage(squeezedCanvas, 0, 0);
        document.getElementById('previewArea').style.display = 'block';
        document.getElementById('downloadBtn').style.display = 'block';
    }

    function downloadGobo() {
        const link = document.createElement('a');
        link.download = 'Gobo_Ultimate_JWB.png';
        link.href = document.getElementById('canvas').toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
