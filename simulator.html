<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobo Pro - Visual Simulator (Ar Rass Edition)</title>
    <style>
        :root { --bg: #0d0d1a; --card: rgba(26, 26, 41, 0.7); --primary: #9b59b6; --secondary: #3498db; --accent: #ff00ff; --success: #2ecc71; --warning: #e74c3c; --text: #ecf0f1; --muted: #bdc3c7; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 25px; font-family: 'Cairo', -apple-system, sans-serif; background: var(--bg); color: var(--text); background-image: radial-gradient(circle at 10% 20%, rgba(155, 89, 182, 0.1) 0%, rgba(0, 0, 0, 0) 90%), radial-gradient(circle at 90% 80%, rgba(52, 152, 219, 0.1) 0%, rgba(0, 0, 0, 0) 90%); }
        .container { max-width: 1000px; margin: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: var(--primary); text-shadow: 0 0 10px rgba(155, 89, 182, 0.5); }
        .back-btn { background: rgba(52, 152, 219, 0.2); color: white; text-decoration: none; padding: 10px 20px; border-radius: 12px; font-size: 14px; border: 1px solid rgba(52, 152, 219, 0.3); transition: 0.3s; }
        .back-btn:hover { background: rgba(52, 152, 219, 0.4); box-shadow: 0 0 15px rgba(52, 152, 219, 0.4); }

        .simulator-card { background: var(--card); border-radius: 25px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); backdrop-filter: blur(10px); border: 1px solid var(--border); }
        
        .stats-row { display: grid; grid-template-columns: 1fr; gap: 20px; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 25px; }
        @media(min-width: 600px) { .stats-row { grid-template-columns: 1fr 1fr; } }
        
        .stat-box { background: rgba(0,0,0,0.2); border-radius: 15px; padding: 15px 20px; border: 1px solid var(--border); transition: 0.3s;}
        .stat-box:hover { border-color: rgba(255,255,255,0.2); }
        .stat-label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 7px; font-weight: bold;}
        .stat-value { font-size: 28px; font-weight: bold; color: white; display: inline-block; text-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .stat-value.scale { color: var(--success); text-shadow: 0 0 10px rgba(46, 204, 113, 0.5); }

        .canvas-container { width: 100%; background: #080811; border-radius: 18px; margin-bottom: 30px; overflow: hidden; border: 1px solid #1a1a2e; box-shadow: inset 0 5px 20px rgba(0,0,0,0.7); }
        canvas { width: 100%; display: block; }

        .controls-grid { display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media(min-width: 768px) { .controls-grid { grid-template-columns: 1fr 1fr; } }
        
        .control-group { background: rgba(20, 20, 30, 0.5); padding: 20px; border-radius: 15px; border: 1px solid var(--border); transition: 0.3s;}
        .control-group:hover { border-color: rgba(155, 89, 182, 0.3); box-shadow: 0 0 15px rgba(155, 89, 182, 0.1); }
        
        .control-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .control-label { font-size: 15px; font-weight: bold; color: var(--muted); display: flex; align-items: center; gap: 8px; }
        
        input[type="range"] { width: calc(100% - 70px); accent-color: var(--primary); height: 8px; cursor: pointer; }
        input[type="number"] { width: 60px; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold;}
        
        /* تصميم قائمة العدسات الجديدة المبهجة */
        select#lensRatio { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid #333; color: white; padding: 12px 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        select#lensRatio:hover { border-color: var(--secondary); box-shadow: 0 0 10px rgba(52, 152, 219, 0.3); }
        
        /* أيقونات مبهجة */
        .icon { font-size: 18px; }
        .icon-magenta { color: var(--accent); }
        .icon-cyan { color: var(--secondary); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">🎯 Gobo Pro - المحاكي الميداني <span style="font-size:14px; color:var(--muted);">(نسخة الرس الاحتفالية)</span></div>
        <a href="index.html" class="back-btn">👁️ العودة للحاسبة الرئيسية</a>
    </div>

    <div class="simulator-card">
        <div class="stats-row">
            <div class="stat-box">
                <span class="stat-label">👁️ القطر الأقصى لضوء العدسة المحددة</span>
                <span class="stat-value" id="valDia">3.90 م</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">📏 نسبة التصغير التلقائي للتصميم (SCALE)</span>
                <span class="stat-value scale" id="valScale">100% (أكبر من العدسة!)</span>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas" width="900" height="450"></canvas>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon icon-cyan">📏</span> المسافة للجدار (متر)</span>
                    <input type="number" id="distInput" value="6" step="0.5">
                </div>
                <input type="range" id="distSlider" min="1" max="25" step="0.5" value="6" style="width:100%;">
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon icon-cyan">🔎</span> عدسة جهازك (Lens Scale)</span>
                </div>
                <select id="lensRatio">
                    <option value="0.2">0.2 Scale (للمسافات البعيدة)</option>
                    <option value="0.3">0.3 Scale (الافتراضية - Default)</option>
                    <option value="0.45">0.45 Scale (للمسافات المتوسطة)</option>
                    <option value="0.65" selected>0.65 Scale (الأوسع - Wide Angle)</option>
                </select>
            </div>

            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon icon-magenta">✨</span> العرض المستهدف للتصميم (متر)</span>
                    <input type="number" id="widthInput" value="4.78">
                </div>
                <input type="range" id="widthSlider" min="1" max="15" step="0.1" value="4.78" style="width:100%;">
            </div>
            
            <div class="control-group">
                <div class="control-header">
                    <span class="control-label"><span class="icon icon-magenta">✨</span> الارتفاع المستهدف للتصميم (متر)</span>
                    <input type="number" id="heightInput" value="5.8">
                </div>
                <input type="range" id="heightSlider" min="1" max="15" step="0.1" value="5.8" style="width:100%;">
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // الحالة الافتراضية مطابقة لأرقامك الميدانية
    const state = { dist: 6, width: 4.78, height: 5.8 };

    // ربط مدخلات الأرقام والأسليدر
    ['dist', 'width', 'height'].forEach(id => {
        const slider = document.getElementById(id + 'Slider');
        const num = document.getElementById(id + 'Input');
        
        slider.addEventListener('input', (e) => { num.value = e.target.value; state[id] = parseFloat(e.target.value); draw(); });
        num.addEventListener('input', (e) => { slider.value = e.target.value; state[id] = parseFloat(e.target.value); draw(); });
    });

    // ربط اختيار العدسة الجديدة
    const lensSelect = document.getElementById('lensRatio');
    lensSelect.addEventListener('change', draw);

    function draw() {
        const lensRatio = parseFloat(lensSelect.value);

        // 1. الحسبة الهندسية الواقعية والمبسطة (قاعدة المصنع 100%)
        const maxDia = state.dist * lensRatio;
        const targetMax = Math.max(state.width, state.height);
        let scale = (targetMax / maxDia) * 100;
        
        // تحديث نصوص النتائج المبهجة
        document.getElementById('valDia').innerText = maxDia.toFixed(2) + ' م';
        
        const scaleEl = document.getElementById('valScale');
        if(scale > 100) {
            scaleEl.innerText = "أكبر من العدسة!";
            scaleEl.style.color = "#e74c3c";
            scaleEl.style.textShadow = "0 0 10px rgba(231, 76, 60, 0.5)";
            scale = 100;
        } else {
            scaleEl.innerText = scale.toFixed(1) + '%';
            scaleEl.style.color = "#2ecc71";
            scaleEl.style.textShadow = "0 0 10px rgba(46, 204, 113, 0.5)";
        }

        // 2. الرسم الاحتفالي على الكانفاس
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const projX = 100;
        const projY = canvas.height / 2;
        const pixelsPerMeter = Math.max(20, (canvas.width - projX) / (parseFloat(document.getElementById('distSlider').max) * 1.1)); // مقياس رسم ديناميكي
        const wallX = projX + (state.dist * pixelsPerMeter);
        const radiusPixels = (maxDia / 2) * pixelsPerMeter;

        // خط المسافة الليزري المبهج
        ctx.beginPath();
        ctx.moveTo(projX + 20, projY);
        ctx.lineTo(wallX, projY);
        ctx.strokeStyle = 'rgba(155, 89, 182, 0.4)';
        ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
        
        ctx.fillStyle = '#bdc3c7'; ctx.font = '14px Cairo'; ctx.textAlign = 'center';
        ctx.fillText(state.dist.toFixed(1) + 'm', projX + (wallX - projX)/2, projY - 12);

        // مخروط الضوء الملون (Cyan للمحيط)
        ctx.beginPath();
        ctx.moveTo(projX + 25, projY);
        ctx.lineTo(wallX, projY - radiusPixels);
        ctx.lineTo(wallX, projY + radiusPixels);
        ctx.closePath();
        ctx.fillStyle = 'rgba(52, 152, 219, 0.05)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(52, 152, 219, 0.3)';
        ctx.stroke();

        // الجدار (المساحة المضاءة الواقعية)
        ctx.beginPath();
        ctx.moveTo(wallX, projY - radiusPixels);
        ctx.lineTo(wallX, projY + radiusPixels);
        ctx.lineWidth = 5; ctx.strokeStyle = '#3498db'; ctx.stroke(); ctx.lineWidth = 1;
        ctx.fillText(maxDia.toFixed(2) + 'm (القطر الأقصى)', wallX + 50, projY + radiusPixels + 15);

        // مساحة الهدف المبهجة (Magenta)
        const targetRadiusPixels = (targetMax / 2) * pixelsPerMeter;
        ctx.beginPath();
        ctx.moveTo(wallX, projY - targetRadiusPixels);
        ctx.lineTo(wallX, projY + targetRadiusPixels);
        ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255, 0, 255, 0.6)'; ctx.stroke(); ctx.lineWidth = 1;
        
        ctx.fillStyle = '#ff00ff';
        ctx.fillText(targetMax.toFixed(2) + 'm (هدفك)', wallX + 35, projY - targetRadiusPixels - 10);

        // البروجكتور المبهج (البنفسجي)
        ctx.fillStyle = '#9b59b6';
        ctx.fillRect(projX - 35, projY - 20, 50, 40);
        ctx.fillStyle = '#ecf0f1';
        ctx.beginPath(); ctx.moveTo(projX + 25, projY - 10); ctx.lineTo(projX + 35, projY - 15); ctx.lineTo(projX + 35, projY + 15); ctx.lineTo(projX + 25, projY + 10); ctx.fill();
        
        ctx.textAlign = 'left';
    }

    // أول رسمة عند تحميل الصفحة
    draw();
</script>
</body>
</html>
