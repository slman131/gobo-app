<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobo Pro - 3D Visual Simulator</title>
    <style>
        :root { --bg: #0a0a12; --panel: rgba(20, 20, 35, 0.9); --primary: #9b59b6; --secondary: #3498db; --design: #ff00ff; --text: #f1f2f6; --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); overflow-x: hidden; }
        
        .header { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px; }
        .back-btn { background: var(--panel); color: white; text-decoration: none; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; transition: 0.3s; }
        .back-btn:hover { background: var(--primary); }

        .app-grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; max-width: 1400px; margin: auto; }
        @media (max-width: 1000px) { .app-grid { grid-template-columns: 1fr; } }

        /* منطقة المحاكي */
        .simulator-viewport { background: #000; border-radius: 25px; position: relative; border: 2px solid #1e1e30; height: 600px; overflow: hidden; box-shadow: inset 0 0 100px rgba(0,0,0,1); }
        canvas { width: 100%; height: 100%; display: block; }

        /* لوحة التحكم */
        .controls-panel { background: var(--panel); border-radius: 25px; padding: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); height: fit-content; }
        .control-group { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .control-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: var(--secondary); margin-bottom: 10px; }
        .val-badge { background: var(--primary); padding: 2px 8px; border-radius: 5px; color: white; font-size: 12px; }
        
        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
        input[type="number"] { width: 100%; background: #000; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 8px; margin-top: 5px; }
        select { width: 100%; background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 10px; margin-top: 5px; }

        .status-card { background: #000; border-radius: 15px; padding: 15px; margin-top: 10px; border-right: 4px solid var(--primary); }
        .status-item { font-size: 12px; color: #888; margin-bottom: 5px; }
        .status-val { font-size: 18px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0; color:var(--primary);">🎭 Gobo 3D Simulator (Pro Edition)</h2>
    <a href="index.html" class="back-btn">⬅ العودة للحاسبة الرئيسية</a>
</div>

<div class="app-grid">
    <div class="simulator-viewport">
        <canvas id="renderCanvas"></canvas>
    </div>

    <div class="controls-panel">
        <div class="status-card">
            <div class="status-item">📏 الارتفاع الفعلي للتصميم:</div>
            <div class="status-val" id="calcHeight">0.00 م</div>
            <div class="status-item" style="margin-top:10px;">🔦 القطر الأقصى المتاح للعدسة:</div>
            <div class="status-val" id="maxBeam">0.00 م</div>
        </div>

        <div class="control-group">
            <div class="control-label">🏢 ارتفاع المبنى بالكامل (متر) <span class="val-badge" id="bH_val">15</span></div>
            <input type="range" id="bHeight" min="5" max="40" value="15">
        </div>

        <div class="control-group">
            <div class="control-label">🔎 نوع العدسة (Lens Scale)</div>
            <select id="lens">
                <option value="0.2">0.2 Scale</option>
                <option value="0.3">0.3 Scale (Default)</option>
                <option value="0.45">0.45 Scale</option>
                <option value="0.65" selected>0.65 Scale (Wide)</option>
            </select>
        </div>

        <div class="control-group">
            <div class="control-label">📏 المسافة للجدار (D) <span class="val-badge" id="dist_val">8.5</span></div>
            <input type="range" id="dist" min="2" max="40" step="0.5" value="8.5">
        </div>

        <div class="control-group">
            <div class="control-label">✨ عرض التصميم (متر) <span class="val-badge" id="tW_val">5</span></div>
            <input type="range" id="tWidth" min="1" max="20" step="0.1" value="5">
        </div>

        <div class="control-group">
            <div class="control-label">⬆️ أعلى نقطة (H_top) <span class="val-badge" id="hTop_val">10</span></div>
            <input type="range" id="hTop" min="0" max="40" step="0.1" value="10">
        </div>

        <div class="control-group">
            <div class="control-label">⬇️ أدنى نقطة (H_bot) <span class="val-badge" id="hBot_val">4</span></div>
            <input type="range" id="hBot" min="0" max="40" step="0.1" value="4">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');

    const state = {
        bHeight: 15,
        lens: 0.65,
        dist: 8.5,
        tWidth: 5,
        hTop: 10,
        hBot: 4
    };

    // ربط السلايدرز
    const sliders = ['bHeight', 'dist', 'tWidth', 'hTop', 'hBot'];
    sliders.forEach(id => {
        const el = document.getElementById(id);
        el.oninput = (e) => {
            state[id] = parseFloat(e.target.value);
            document.getElementById(id + '_val').innerText = e.target.value;
            update();
        };
    });
    document.getElementById('lens').onchange = (e) => { state.lens = parseFloat(e.target.value); update(); };

    function update() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // مقياس الرسم (Pixels per Meter)
        const margin = 80;
        const availableH = canvas.height - (margin * 2);
        const pxMeter = availableH / state.bHeight;
        
        const groundY = canvas.height - margin;
        const wallX = canvas.width - 250;
        const projX = 100;
        const projY = groundY - (1.5 * pxMeter); // ارتفاع افتراضي للبروجكتور

        // 1. رسم الأرضية (3D Perspective)
        ctx.beginPath();
        ctx.moveTo(0, groundY);
        ctx.lineTo(canvas.width, groundY);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 2. رسم المبنى (The Building)
        const bH_px = state.bHeight * pxMeter;
        const bW_px = 200;
        
        // واجهة المبنى
        ctx.fillStyle = "#11111d";
        ctx.fillRect(wallX, groundY - bH_px, bW_px, bH_px);
        
        // خطوط النوافذ/الطوابق للواقعية
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        for(let i=0; i<=state.bHeight; i+=3) {
            let y = groundY - (i * pxMeter);
            ctx.beginPath();
            ctx.moveTo(wallX, y); ctx.lineTo(wallX + bW_px, y);
            ctx.stroke();
        }

        // 3. حسابات التصميم (The Gobo Design)
        const actualH = Math.abs(state.hTop - state.hBot);
        document.getElementById('calcHeight').innerText = actualH.toFixed(2) + " م";
        
        const maxDia = state.dist * state.lens;
        document.getElementById('maxBeam').innerText = maxDia.toFixed(2) + " م";

        // 4. رسم أشعة البروجكتور (The Beam)
        const beamCenterH = (state.hTop + state.hBot) / 2;
        const beamCenterY = groundY - (beamCenterH * pxMeter);
        const beamRadiusPX = (maxDia / 2) * pxMeter;

        const beamGrad = ctx.createRadialGradient(projX, projY, 0, projX, projY, canvas.width);
        beamGrad.addColorStop(0, 'rgba(52, 152, 219, 0.5)');
        beamGrad.addColorStop(0.6, 'rgba(52, 152, 219, 0.05)');
        beamGrad.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.moveTo(projX, projY);
        ctx.lineTo(wallX, beamCenterY - beamRadiusPX);
        ctx.lineTo(wallX, beamCenterY + beamRadiusPX);
        ctx.closePath();
        ctx.fillStyle = beamGrad;
        ctx.fill();

        // 5. أيقونة التصميم (The Design Icon Overlay)
        const desH_px = actualH * pxMeter;
        const desW_px = state.tWidth * pxMeter; // استخدام العرض الفعلي المدخل
        const desY = groundY - (state.hTop * pxMeter);

        // توهج التصميم
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff00ff";
        
        // رسم برواز التصميم على واجهة المبنى
        ctx.strokeStyle = "#ff00ff";
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]); // خط مقطع كأنه ليزر
        ctx.strokeRect(wallX + 10, desY, 100, desH_px); // تمثيل العرض بخط رمزي على المبنى
        
        // رسم "أيقونة" التصميم ككتلة ضوء
        ctx.fillStyle = "rgba(255, 0, 255, 0.2)";
        ctx.fillRect(wallX + 10, desY, 100, desH_px);
        ctx.setLineDash([]);
        ctx.shadowBlur = 0;

        // 6. عرض المقاسات بجانب التصميم
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Segoe UI";
        ctx.textAlign = "right";
        ctx.fillText(`الارتفاع: ${actualH.toFixed(2)} م`, wallX - 10, desY + (desH_px/2));
        ctx.fillText(`العرض: ${state.tWidth.toFixed(2)} م`, wallX - 10, desY + (desH_px/2) + 20);

        // خطوط توضح الارتفاع عن الأرض
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.beginPath();
        ctx.moveTo(wallX, desY + desH_px); ctx.lineTo(wallX - 50, desY + desH_px);
        ctx.stroke();
        ctx.fillText(`${state.hBot.toFixed(1)}م عن الأرض`, wallX - 10, desY + desH_px + 20);

        // رسم البروجكتور
        ctx.fillStyle = "#9b59b6";
        ctx.fillRect(projX - 40, projY - 15, 50, 30);
        ctx.beginPath();
        ctx.moveTo(projX + 10, projY - 10); ctx.lineTo(projX + 25, projY - 15);
        ctx.lineTo(projX + 25, projY + 15); ctx.lineTo(projX + 10, projY + 10);
        ctx.fill();
    }

    window.onresize = update;
    update();
</script>
</body>
</html>
